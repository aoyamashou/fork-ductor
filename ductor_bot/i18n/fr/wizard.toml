# fr interface strings

[common]
cancelled = "[dim]Configuration annulée.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "Backends CLI"
header = "[bold]Backends IA détectés :[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Au moins un CLI doit être installé et authentifié.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Avertissement[/bold yellow]"
body = "[bold]Important — lis bien avant de continuer.[/bold]\n\nductor se connecte à [bold]Anthropic Claude CLI[/bold] et [bold]OpenAI Codex CLI[/bold] comme backends d'agent IA.\n\nLe bot fonctionne en [bold yellow]mode accès complet[/bold yellow]. L'agent peut lire, écrire et supprimer des fichiers, exécuter des commandes et interagir avec ton système sans demander de confirmation.\n\nBien que des protections soient en place, [bold red]des actions non souhaitées peuvent survenir[/bold red] — y compris la perte de données, des modifications de fichiers inattendues ou l'exécution involontaire de commandes.\n\n[bold green]Nous recommandons fortement de lancer ductor dans un conteneur Docker[/bold green] pour l'isoler de ton système hôte."
confirm = "Je comprends les risques et je veux continuer."

[telegram.token]
title = "[bold]Token Telegram du bot[/bold]"
body = "[bold]Comment obtenir ton token Telegram :[/bold]\n\n  1. Ouvre Telegram et cherche [bold cyan]@BotFather[/bold cyan]\n  2. Envoie [bold]/newbot[/bold] et suis les instructions\n  3. Choisis un nom et un identifiant pour ton bot\n  4. BotFather te répondra avec ton token\n\n[dim]Format du token : 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Colle ton token de bot :"
error = "[red]Format de token invalide. Attendu : chiffres:alphanumérique (par ex. 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]ID utilisateur Telegram[/bold]"
body = "[bold]Comment trouver ton ID utilisateur Telegram :[/bold]\n\n  1. Ouvre Telegram et cherche [bold cyan]@userinfobot[/bold cyan]\n  2. Envoie [bold]/start[/bold] au bot\n  3. Il te répondra avec ton ID numérique\n\n[dim]Seuls les messages provenant de cet ID seront acceptés par le bot.[/dim]"
prompt = "Entre ton ID utilisateur numérique :"
error_nan = "[red]Entre un nombre valide, s'il te plaît.[/red]"
error_negative = "[red]L'ID utilisateur doit être un nombre positif.[/red]"

[docker]
title = "[bold]Sandboxing Docker[/bold]"
found_body = "[bold green]Docker détecté sur ton système.[/bold green]\n\nLancer ductor dans Docker l'isole de ton hôte.\nC'est la configuration recommandée pour la sécurité."
found_prompt = "Activer le sandboxing Docker ? (Recommandé)"
not_found_body = "[bold yellow]Docker n'a pas été trouvé sur ton système.[/bold yellow]\n\nNous recommandons d'installer Docker pour lancer le bot dans un conteneur isolé.\nTu peux activer le sandboxing Docker plus tard dans la config.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Extras Docker disponibles[/bold]"
col_package = "Paquet"
col_description = "Description"
col_size = "Taille"
prompt = "Sélectionne les extras (Espace pour basculer, Entrée pour confirmer) :"
hint = "[dim]Ces paquets sont optionnels et augmentent le temps de build de l'image.\nTu peux changer ça plus tard avec [cyan]ductor docker extras-add / extras-remove[/cyan].[/dim]"
auto_deps = "[dim]Dépendances ajoutées automatiquement : {names}[/dim]"

[timezone]
title = "[bold]Fuseau horaire[/bold]"
body = "Ton fuseau horaire est utilisé pour la planification cron, les heures calmes du heartbeat\net les réinitialisations quotidiennes de session."
prompt = "Choisis ton fuseau horaire :"
manual_prompt = "Entre le fuseau horaire IANA (par ex. Europe/Paris) :"
error = "[red]Fuseau horaire inconnu : {tz}[/red]"

[service]
title = "[bold]Service d'arrière-plan[/bold]"
body = "[bold]Lancer ductor en service d'arrière-plan ?[/bold]\n\nCeci crée un {mechanism} qui :\n\n  - Démarre ductor au {trigger}\n  - Redémarre automatiquement en cas de crash\n  - Continue de tourner en arrière-plan\n\n[dim]Recommandé pour les VPS ou les configurations toujours allumées.[/dim]"
prompt = "Installer en service d'arrière-plan ? (Recommandé pour VPS)"

[complete]
title = "[bold green]Prêt[/bold green]"
header = "[bold green]Configuration terminée ![/bold green]"
files_header = "[bold]Tes fichiers ductor :[/bold]"
home = "  Home :      [cyan]{path}[/cyan]"
config = "  Config :    [cyan]{path}[/cyan]"
workspace = "  Workspace : [cyan]{path}[/cyan]"
logs = "  Logs :      [cyan]{path}[/cyan]"
installing_service = "Installation du service..."
starting_bot = "Démarrage du bot..."

[reset]
title = "[bold yellow]Configuration existante détectée[/bold yellow]"
body = "[bold yellow]Tu as déjà une configuration en place.[/bold yellow]\n\nRelancer l'onboarding effectuera une [bold red]réinitialisation complète[/bold red] :\n\n  [dim]{home}[/dim] sera entièrement supprimé.\n  Toutes les sessions, configs, mémoire et tâches cron seront perdues."

[reset.docker]
title = "[bold]Nettoyage Docker[/bold]"
body = "[bold]Le sandboxing Docker est activé dans ta config actuelle.[/bold]\n\n  Conteneur : [cyan]{container}[/cyan]\n  Image :     [cyan]{image}[/cyan]"
prompt = "Supprimer le conteneur et l'image Docker ?"
removing = "[dim]Suppression des ressources Docker...[/dim]"
done = "[green]Nettoyage Docker terminé.[/green]"

[reset.confirm]
prompt = "Tout supprimer et repartir de zéro ?"
deleted = "[dim]Workspace supprimé.[/dim]"
warning = "[yellow]Attention : {home} n'a pas pu être entièrement supprimé. Supprime-le manuellement.[/yellow]"

[language]
prompt = "Select language / Choisir la langue :"
