# de interface strings

[common]
cancelled = "[dim]Setup abgebrochen.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "CLI Backends"
header = "[bold]Erkannte KI-Backends:[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Mindestens ein CLI muss installiert und authentifiziert sein.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Haftungsausschluss[/bold yellow]"
body = "[bold]Wichtig — bitte vor dem Fortfahren lesen.[/bold]\n\nductor verbindet sich mit [bold]Anthropic Claude CLI[/bold] und [bold]OpenAI Codex CLI[/bold] als KI-Agent-Backends.\n\nDer Bot arbeitet im [bold yellow]Vollzugriffsmodus[/bold yellow]. Der Agent kann Dateien lesen, schreiben und löschen, Befehle ausführen und mit deinem System interagieren — ohne vorher zu fragen.\n\nObwohl Sicherheitsmechanismen vorhanden sind, können [bold red]unbeabsichtigte Aktionen auftreten[/bold red] — einschließlich Datenverlust, unerwartete Dateiänderungen oder unbeabsichtigte Befehlsausführung.\n\n[bold green]Wir empfehlen dringend, ductor in einem Docker-Container zu betreiben[/bold green], um es von deinem Host-System zu isolieren."
confirm = "Ich verstehe die Risiken und möchte fortfahren."

[telegram.token]
title = "[bold]Telegram Bot Token[/bold]"
body = "[bold]So bekommst du deinen Telegram Bot Token:[/bold]\n\n  1. Öffne Telegram und suche nach [bold cyan]@BotFather[/bold cyan]\n  2. Sende [bold]/newbot[/bold] und folge den Anweisungen\n  3. Wähle einen Namen und Benutzernamen für deinen Bot\n  4. BotFather antwortet mit deinem Bot-Token\n\n[dim]Token-Format: 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Bot-Token einfügen:"
error = "[red]Ungültiges Token-Format. Erwartet: Ziffern:Alphanumerisch (z.B. 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]Telegram User ID[/bold]"
body = "[bold]So findest du deine Telegram User ID:[/bold]\n\n  1. Öffne Telegram und suche nach [bold cyan]@userinfobot[/bold cyan]\n  2. Sende [bold]/start[/bold] an den Bot\n  3. Er antwortet mit deiner numerischen User ID\n\n[dim]Nur Nachrichten von dieser User ID werden vom Bot akzeptiert.[/dim]"
prompt = "Gib deine numerische User ID ein:"
error_nan = "[red]Bitte eine gültige Zahl eingeben.[/red]"
error_negative = "[red]User ID muss eine positive Zahl sein.[/red]"

[docker]
title = "[bold]Docker Sandboxing[/bold]"
found_body = "[bold green]Docker auf deinem System erkannt.[/bold green]\n\nductor in Docker zu betreiben isoliert es von deinem Host.\nDas ist die empfohlene Konfiguration für mehr Sicherheit."
found_prompt = "Docker-Sandboxing aktivieren? (Empfohlen)"
not_found_body = "[bold yellow]Docker wurde auf deinem System nicht gefunden.[/bold yellow]\n\nWir empfehlen Docker zu installieren, um den Bot in einem isolierten Container zu betreiben.\nDu kannst Docker-Sandboxing später in der Config aktivieren.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Verfügbare Docker-Extras[/bold]"
col_package = "Paket"
col_description = "Beschreibung"
col_size = "Größe"
prompt = "Extras auswählen (Leertaste zum Umschalten, Enter zum Bestätigen):"
hint = "[dim]Diese Pakete sind optional und verlängern die Image-Build-Zeit.\nDu kannst das später mit [cyan]ductor docker extras-add / extras-remove[/cyan] ändern.[/dim]"
auto_deps = "[dim]Automatisch hinzugefügte Abhängigkeiten: {names}[/dim]"

[timezone]
title = "[bold]Zeitzone[/bold]"
body = "Deine Zeitzone wird für Cron-Planung, Heartbeat-Ruhezeiten\nund tägliche Session-Resets verwendet."
prompt = "Wähle deine Zeitzone:"
manual_prompt = "IANA-Zeitzone eingeben (z.B. Europe/Berlin):"
error = "[red]Unbekannte Zeitzone: {tz}[/red]"

[service]
title = "[bold]Hintergrund-Dienst[/bold]"
body = "[bold]ductor als Hintergrund-Dienst ausführen?[/bold]\n\nDas erstellt einen {mechanism}, der:\n\n  - ductor bei {trigger} startet\n  - Bei Absturz automatisch neustartet\n  - Im Hintergrund weiterläuft\n\n[dim]Empfohlen für VPS oder Always-on-Setups.[/dim]"
prompt = "Als Hintergrund-Dienst installieren? (Empfohlen für VPS)"

[complete]
title = "[bold green]Fertig[/bold green]"
header = "[bold green]Setup abgeschlossen![/bold green]"
files_header = "[bold]Deine ductor-Dateien:[/bold]"
home = "  Home:       [cyan]{path}[/cyan]"
config = "  Config:     [cyan]{path}[/cyan]"
workspace = "  Workspace:  [cyan]{path}[/cyan]"
logs = "  Logs:       [cyan]{path}[/cyan]"
installing_service = "Dienst wird installiert..."
starting_bot = "Bot wird gestartet..."

[reset]
title = "[bold yellow]Bestehendes Setup erkannt[/bold yellow]"
body = "[bold yellow]Du hast bereits ein konfiguriertes Setup.[/bold yellow]\n\nOnboarding erneut ausführen bedeutet ein [bold red]komplettes Reset[/bold red]:\n\n  [dim]{home}[/dim] wird vollständig gelöscht.\n  Alle Sessions, Configs, Speicher und Cron-Jobs gehen verloren."

[reset.docker]
title = "[bold]Docker-Bereinigung[/bold]"
body = "[bold]Docker-Sandboxing ist in deiner aktuellen Config aktiviert.[/bold]\n\n  Container: [cyan]{container}[/cyan]\n  Image:     [cyan]{image}[/cyan]"
prompt = "Docker-Container und Image entfernen?"
removing = "[dim]Docker-Ressourcen werden entfernt...[/dim]"
done = "[green]Docker-Bereinigung abgeschlossen.[/green]"

[reset.confirm]
prompt = "Alles löschen und neu anfangen?"
deleted = "[dim]Workspace gelöscht.[/dim]"
warning = "[yellow]Warnung: {home} konnte nicht vollständig gelöscht werden. Bitte manuell entfernen.[/yellow]"

[language]
prompt = "Select language / Sprache wählen:"
