# pt interface strings

[common]
cancelled = "[dim]Configuração cancelada.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "Backends de CLI"
header = "[bold]Backends de IA Detectados:[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Pelo menos um CLI precisa estar instalado e autenticado.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Aviso Legal[/bold yellow]"
body = "[bold]Importante — por favor, leia antes de continuar.[/bold]\n\nductor se conecta ao [bold]Anthropic Claude CLI[/bold] e [bold]OpenAI Codex CLI[/bold] como backends de agentes de IA.\n\nO bot opera em [bold yellow]modo de permissão total[/bold yellow]. O agente pode ler, escrever e excluir arquivos, executar comandos e interagir com o seu sistema sem pedir confirmação.\n\nEmbora existam proteções, [bold red]ações não intencionais podem ocorrer[/bold red] — incluindo perda de dados, alterações inesperadas em arquivos ou execução não intencional de comandos.\n\n[bold green]Recomendamos fortemente executar o ductor dentro de um container Docker[/bold green] para isolá-lo do seu sistema host."
confirm = "Eu entendo os riscos e quero continuar."

[telegram.token]
title = "[bold]Token do Bot Telegram[/bold]"
body = "[bold]Como obter seu Token do Bot Telegram:[/bold]\n\n  1. Abra o Telegram e procure por [bold cyan]@BotFather[/bold cyan]\n  2. Envie [bold]/newbot[/bold] e siga as instruções\n  3. Escolha um nome e username para seu bot\n  4. O BotFather vai responder com o token do seu bot\n\n[dim]Formato do token: 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Cole o token do seu bot:"
error = "[red]Formato de token inválido. Esperado: dígitos:alfanumérico (ex.: 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]ID de Usuário Telegram[/bold]"
body = "[bold]Como encontrar seu ID de Usuário Telegram:[/bold]\n\n  1. Abra o Telegram e procure por [bold cyan]@userinfobot[/bold cyan]\n  2. Envie [bold]/start[/bold] para o bot\n  3. Ele vai responder com seu ID numérico de usuário\n\n[dim]Apenas mensagens deste ID de usuário serão aceitas pelo bot.[/dim]"
prompt = "Digite seu ID numérico de usuário:"
error_nan = "[red]Por favor, digite um número válido.[/red]"
error_negative = "[red]ID de usuário deve ser um número positivo.[/red]"

[docker]
title = "[bold]Docker Sandboxing[/bold]"
found_body = "[bold green]Docker detectado no seu sistema.[/bold green]\n\nExecutar o ductor dentro do Docker o isola do seu host.\nEsta é a configuração recomendada para segurança."
found_prompt = "Habilitar Docker sandboxing? (Recomendado)"
not_found_body = "[bold yellow]Docker não foi encontrado no seu sistema.[/bold yellow]\n\nRecomendamos instalar o Docker para executar o bot em um container isolado.\nVocê pode habilitar o Docker sandboxing depois na config.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Extras Docker Disponíveis[/bold]"
col_package = "Pacote"
col_description = "Descrição"
col_size = "Tamanho"
prompt = "Selecione extras (Espaço para alternar, Enter para confirmar):"
hint = "[dim]Esses pacotes são opcionais e aumentam o tempo de build da imagem.\nVocê pode alterar isso depois com [cyan]ductor docker extras-add / extras-remove[/cyan].[/dim]"
auto_deps = "[dim]Dependências adicionadas automaticamente: {names}[/dim]"

[timezone]
title = "[bold]Fuso Horário[/bold]"
body = "Seu fuso horário é usado para agendamento de cron, horários de silêncio do heartbeat\ne resets diários de sessão."
prompt = "Selecione seu fuso horário:"
manual_prompt = "Digite o fuso horário IANA (ex.: America/Sao_Paulo):"
error = "[red]Fuso horário desconhecido: {tz}[/red]"

[service]
title = "[bold]Serviço em Segundo Plano[/bold]"
body = "[bold]Executar o ductor como serviço em segundo plano?[/bold]\n\nIsso cria um {mechanism} que:\n\n  - Inicia o ductor em {trigger}\n  - Reinicia automaticamente em caso de crash\n  - Continua rodando em segundo plano\n\n[dim]Recomendado para VPS ou setups sempre ligados.[/dim]"
prompt = "Instalar como serviço em segundo plano? (Recomendado para VPS)"

[complete]
title = "[bold green]Pronto[/bold green]"
header = "[bold green]Configuração concluída![/bold green]"
files_header = "[bold]Seus arquivos ductor:[/bold]"
home = "  Home:       [cyan]{path}[/cyan]"
config = "  Config:     [cyan]{path}[/cyan]"
workspace = "  Workspace:  [cyan]{path}[/cyan]"
logs = "  Logs:       [cyan]{path}[/cyan]"
installing_service = "Instalando serviço..."
starting_bot = "Iniciando bot..."

[reset]
title = "[bold yellow]Setup Existente Detectado[/bold yellow]"
body = "[bold yellow]Você já possui um setup configurado.[/bold yellow]\n\nReexecutar o onboarding fará um [bold red]reset completo[/bold red]:\n\n  [dim]{home}[/dim] será excluído por completo.\n  Todas as sessões, configs, memória e cron jobs serão perdidos."

[reset.docker]
title = "[bold]Limpeza Docker[/bold]"
body = "[bold]Docker sandboxing está habilitado na sua config atual.[/bold]\n\n  Container: [cyan]{container}[/cyan]\n  Imagem:    [cyan]{image}[/cyan]"
prompt = "Remover o container e a imagem Docker?"
removing = "[dim]Removendo recursos Docker...[/dim]"
done = "[green]Limpeza Docker concluída.[/green]"

[reset.confirm]
prompt = "Excluir tudo e começar do zero?"
deleted = "[dim]Workspace excluído.[/dim]"
warning = "[yellow]Aviso: Não foi possível excluir completamente {home}. Remova manualmente.[/yellow]"

[language]
prompt = "Select language / Selecione o idioma:"
