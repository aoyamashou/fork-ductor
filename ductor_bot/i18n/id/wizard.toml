# id interface strings

[common]
cancelled = "[dim]Pengaturan dibatalkan.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "Backend CLI"
header = "[bold]Backend AI yang Terdeteksi:[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Setidaknya satu CLI harus terpasang dan terautentikasi.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Penafian[/bold yellow]"
body = "[bold]Penting -- harap baca sebelum melanjutkan.[/bold]\n\nductor terhubung ke [bold]Anthropic Claude CLI[/bold] dan [bold]OpenAI Codex CLI[/bold] sebagai backend agen AI.\n\nBot beroperasi dalam [bold yellow]mode bypass izin penuh[/bold yellow]. Agen dapat membaca, menulis, dan menghapus file, menjalankan perintah, dan berinteraksi dengan sistem Anda tanpa meminta konfirmasi.\n\nMeskipun ada perlindungan, [bold red]tindakan yang tidak diinginkan dapat terjadi[/bold red] -- termasuk kehilangan data, perubahan file yang tidak terduga, atau eksekusi perintah yang tidak diinginkan.\n\n[bold green]Kami sangat menyarankan untuk menjalankan ductor di dalam kontainer Docker[/bold green] untuk mengisolasi dari sistem host Anda."
confirm = "Saya memahami risikonya dan ingin melanjutkan."

[telegram.token]
title = "[bold]Token Bot Telegram[/bold]"
body = "[bold]Cara mendapatkan Token Bot Telegram Anda:[/bold]\n\n  1. Buka Telegram dan cari [bold cyan]@BotFather[/bold cyan]\n  2. Kirim [bold]/newbot[/bold] dan ikuti petunjuknya\n  3. Pilih nama dan username untuk bot Anda\n  4. BotFather akan membalas dengan token bot Anda\n\n[dim]Format token: 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Tempel token bot Anda:"
error = "[red]Format token tidak valid. Diharapkan: angka:alfanumerik (mis. 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]ID Pengguna Telegram[/bold]"
body = "[bold]Cara menemukan ID Pengguna Telegram Anda:[/bold]\n\n  1. Buka Telegram dan cari [bold cyan]@userinfobot[/bold cyan]\n  2. Kirim [bold]/start[/bold] ke bot\n  3. Bot akan membalas dengan ID pengguna numerik Anda\n\n[dim]Hanya pesan dari ID pengguna ini yang akan diterima oleh bot.[/dim]"
prompt = "Masukkan ID pengguna numerik Anda:"
error_nan = "[red]Masukkan angka yang valid.[/red]"
error_negative = "[red]ID pengguna harus berupa angka positif.[/red]"

[docker]
title = "[bold]Docker Sandboxing[/bold]"
found_body = "[bold green]Docker terdeteksi di sistem Anda.[/bold green]\n\nMenjalankan ductor di dalam Docker mengisolasinya dari host Anda.\nIni adalah pengaturan yang disarankan untuk keamanan."
found_prompt = "Aktifkan Docker sandboxing? (Disarankan)"
not_found_body = "[bold yellow]Docker tidak ditemukan di sistem Anda.[/bold yellow]\n\nKami menyarankan untuk memasang Docker agar bot berjalan di kontainer terisolasi.\nAnda dapat mengaktifkan Docker sandboxing nanti di konfigurasi.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Docker Extras yang Tersedia[/bold]"
col_package = "Paket"
col_description = "Fungsi"
col_size = "Ukuran"
prompt = "Pilih extras (Spasi untuk pilih/batal, Enter untuk konfirmasi):"
hint = "[dim]Paket-paket ini opsional dan meningkatkan waktu build image.\nAnda dapat mengubah ini nanti dengan [cyan]ductor docker extras-add / extras-remove[/cyan].[/dim]"
auto_deps = "[dim]Dependensi otomatis ditambahkan: {names}[/dim]"

[timezone]
title = "[bold]Zona Waktu[/bold]"
body = "Zona waktu Anda digunakan untuk penjadwalan cron, jam tenang heartbeat,\ndan reset sesi harian."
prompt = "Pilih zona waktu Anda:"
manual_prompt = "Masukkan zona waktu IANA (mis. Asia/Jakarta):"
error = "[red]Zona waktu tidak dikenal: {tz}[/red]"

[service]
title = "[bold]Layanan Latar[/bold]"
body = "[bold]Jalankan ductor sebagai layanan latar?[/bold]\n\nIni membuat {mechanism} yang:\n\n  - Memulai ductor saat {trigger}\n  - Restart otomatis saat crash\n  - Tetap berjalan di latar\n\n[dim]Disarankan untuk VPS atau pengaturan yang selalu menyala.[/dim]"
prompt = "Pasang sebagai layanan latar? (Disarankan untuk VPS)"

[complete]
title = "[bold green]Siap[/bold green]"
header = "[bold green]Pengaturan selesai![/bold green]"
files_header = "[bold]File ductor Anda:[/bold]"
home = "  Home:       [cyan]{path}[/cyan]"
config = "  Config:     [cyan]{path}[/cyan]"
workspace = "  Workspace:  [cyan]{path}[/cyan]"
logs = "  Log:        [cyan]{path}[/cyan]"
installing_service = "Memasang layanan..."
starting_bot = "Memulai bot..."

[reset]
title = "[bold yellow]Pengaturan yang Ada Terdeteksi[/bold yellow]"
body = "[bold yellow]Anda sudah memiliki pengaturan yang dikonfigurasi.[/bold yellow]\n\nMenjalankan onboarding ulang akan melakukan [bold red]reset penuh[/bold red]:\n\n  [dim]{home}[/dim] akan dihapus seluruhnya.\n  Semua sesi, konfigurasi, memori, dan tugas cron akan hilang."

[reset.docker]
title = "[bold]Pembersihan Docker[/bold]"
body = "[bold]Docker sandboxing diaktifkan di konfigurasi Anda saat ini.[/bold]\n\n  Kontainer: [cyan]{container}[/cyan]\n  Image:     [cyan]{image}[/cyan]"
prompt = "Hapus kontainer dan image Docker?"
removing = "[dim]Menghapus sumber daya Docker...[/dim]"
done = "[green]Pembersihan Docker selesai.[/green]"

[reset.confirm]
prompt = "Hapus segalanya dan mulai dari awal?"
deleted = "[dim]Workspace dihapus.[/dim]"
warning = "[yellow]Peringatan: Tidak dapat menghapus sepenuhnya {home}. Hapus secara manual.[/yellow]"

