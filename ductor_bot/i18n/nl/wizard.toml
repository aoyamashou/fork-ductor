workspace = "  Workspace:  [cyan]{path}[/cyan]"
logs = "  Logs:       [cyan]{path}[/cyan]"
installing_service = "Dienst wordt geïnstalleerd..."
starting_bot = "Bot wordt gestart..."

[reset]
title = "[bold yellow]Bestaande setup gevonden[/bold yellow]"
body = "[bold yellow]Je hebt al een geconfigureerde setup.[/bold yellow]\n\nOnboarding opnieuw uitvoeren betekent een [bold red]volledige reset[/bold red]:\n\n  [dim]{home}[/dim] wordt volledig verwijderd.\n  Alle sessies, configs, geheugen en cronjobs gaan verloren."

[reset.docker]
title = "[bold]Docker-opruiming[/bold]"
