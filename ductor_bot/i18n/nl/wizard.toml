# nl interface strings

[common]
cancelled = "[dim]Setup geannuleerd.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "CLI Backends"
header = "[bold]Gedetecteerde AI-backends:[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Minstens één CLI moet geïnstalleerd en geauthenticeerd zijn.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Disclaimer[/bold yellow]"
body = "[bold]Belangrijk — lees dit voordat je verdergaat.[/bold]\n\nductor maakt verbinding met [bold]Anthropic Claude CLI[/bold] en [bold]OpenAI Codex CLI[/bold] als AI-agent-backends.\n\nDe bot werkt in [bold yellow]volledige toegangsmodus[/bold yellow]. De agent kan bestanden lezen, schrijven en verwijderen, commando's uitvoeren en met je systeem werken zonder om bevestiging te vragen.\n\nHoewel er beveiligingen aanwezig zijn, kunnen [bold red]onbedoelde acties plaatsvinden[/bold red] — waaronder gegevensverlies, onverwachte bestandswijzigingen of onbedoelde commando-uitvoering.\n\n[bold green]We raden sterk aan om ductor in een Docker-container te draaien[/bold green] om het te isoleren van je hostsysteem."
confirm = "Ik begrijp de risico's en wil doorgaan."

[telegram.token]
title = "[bold]Telegram Bot Token[/bold]"
body = "[bold]Zo krijg je je Telegram Bot Token:[/bold]\n\n  1. Open Telegram en zoek naar [bold cyan]@BotFather[/bold cyan]\n  2. Stuur [bold]/newbot[/bold] en volg de stappen\n  3. Kies een naam en gebruikersnaam voor je bot\n  4. BotFather antwoordt met je bot-token\n\n[dim]Tokenformaat: 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Plak je bot-token:"
error = "[red]Ongeldig tokenformaat. Verwacht: cijfers:alfanumeriek (bijv. 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]Telegram User ID[/bold]"
body = "[bold]Zo vind je je Telegram User ID:[/bold]\n\n  1. Open Telegram en zoek naar [bold cyan]@userinfobot[/bold cyan]\n  2. Stuur [bold]/start[/bold] naar de bot\n  3. Hij antwoordt met je numerieke user ID\n\n[dim]Alleen berichten van deze user ID worden geaccepteerd door de bot.[/dim]"
prompt = "Voer je numerieke user ID in:"
error_nan = "[red]Voer een geldig nummer in.[/red]"
error_negative = "[red]User ID moet een positief nummer zijn.[/red]"

[docker]
title = "[bold]Docker Sandboxing[/bold]"
found_body = "[bold green]Docker gedetecteerd op je systeem.[/bold green]\n\nductor in Docker draaien isoleert het van je host.\nDit is de aanbevolen configuratie voor veiligheid."
found_prompt = "Docker-sandboxing inschakelen? (Aanbevolen)"
not_found_body = "[bold yellow]Docker is niet gevonden op je systeem.[/bold yellow]\n\nWe raden aan Docker te installeren om de bot in een geïsoleerde container te draaien.\nJe kunt Docker-sandboxing later inschakelen in de config.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Beschikbare Docker-extra's[/bold]"
col_package = "Pakket"
col_description = "Beschrijving"
col_size = "Grootte"
prompt = "Selecteer extra's (Spatie om te schakelen, Enter om te bevestigen):"
hint = "[dim]Deze pakketten zijn optioneel en verlengen de image-buildtijd.\nJe kunt dit later wijzigen met [cyan]ductor docker extras-add / extras-remove[/cyan].[/dim]"
auto_deps = "[dim]Automatisch toegevoegde afhankelijkheden: {names}[/dim]"

[timezone]
title = "[bold]Tijdzone[/bold]"
body = "Je tijdzone wordt gebruikt voor cron-planning, heartbeat-rusttijden\nen dagelijkse sessie-resets."
prompt = "Selecteer je tijdzone:"
manual_prompt = "Voer IANA-tijdzone in (bijv. Europe/Amsterdam):"
error = "[red]Onbekende tijdzone: {tz}[/red]"

[service]
title = "[bold]Achtergronddienst[/bold]"
body = "[bold]ductor als achtergronddienst draaien?[/bold]\n\nDit maakt een {mechanism} aan die:\n\n  - ductor start bij {trigger}\n  - Automatisch herstart bij een crash\n  - Op de achtergrond blijft draaien\n\n[dim]Aanbevolen voor VPS of always-on-setups.[/dim]"
prompt = "Als achtergronddienst installeren? (Aanbevolen voor VPS)"

[complete]
title = "[bold green]Klaar[/bold green]"
header = "[bold green]Setup voltooid![/bold green]"
files_header = "[bold]Je ductor-bestanden:[/bold]"
