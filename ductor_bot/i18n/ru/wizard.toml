# ru interface strings

[common]
cancelled = "[dim]Настройка отменена.[/dim]"
subtitle = "ductor.dev"

[cli_backends]
title = "CLI-бэкенды"
header = "[bold]Обнаруженные ИИ-бэкенды:[/bold]\n"
claude = "  Claude Code CLI   {status}"
codex = "  OpenAI Codex CLI  {status}"
gemini = "  Google Gemini CLI {status}"
antigravity = "  Antigravity CLI   {status}"
grok = "  xAI Grok CLI      {status}"
no_auth = "\n[bold red]Хотя бы один CLI должен быть установлен и авторизован.[/bold red]\n\n  Claude: [dim]https://docs.anthropic.com/en/docs/claude-code[/dim]\n  Codex:  [dim]https://github.com/openai/codex[/dim]\n  Gemini: [dim]https://github.com/google-gemini/gemini-cli[/dim]"
claude_check_failed = "[yellow]Claude auth check raised: {error}. Skipping.[/yellow]"
codex_check_failed = "[yellow]Codex auth check raised: {error}. Skipping.[/yellow]"
gemini_check_failed = "[yellow]Gemini auth check raised: {error}. Skipping.[/yellow]"
antigravity_check_failed = "[yellow]Antigravity auth check raised: {error}. Skipping.[/yellow]"
grok_check_failed = "[yellow]Grok auth check raised: {error}. Skipping.[/yellow]"

[disclaimer]
title = "[bold yellow]Отказ от ответственности[/bold yellow]"
body = "[bold]Важно — прочитай перед продолжением.[/bold]\n\nductor подключается к [bold]Anthropic Claude CLI[/bold] и [bold]OpenAI Codex CLI[/bold] как ИИ-бэкендам.\n\nБот работает в [bold yellow]режиме полного доступа[/bold yellow]. Агент может читать, записывать и удалять файлы, выполнять команды и взаимодействовать с твоей системой без подтверждения.\n\nНесмотря на защитные механизмы, [bold red]возможны непреднамеренные действия[/bold red] — включая потерю данных, неожиданные изменения файлов или непреднамеренное выполнение команд.\n\n[bold green]Настоятельно рекомендуем запускать ductor в Docker-контейнере[/bold green], чтобы изолировать его от хост-системы."
confirm = "Я понимаю риски и хочу продолжить."

[telegram.token]
title = "[bold]Telegram Bot Token[/bold]"
body = "[bold]Как получить Telegram Bot Token:[/bold]\n\n  1. Открой Telegram и найди [bold cyan]@BotFather[/bold cyan]\n  2. Отправь [bold]/newbot[/bold] и следуй инструкциям\n  3. Выбери имя и username для бота\n  4. BotFather пришлёт тебе токен\n\n[dim]Формат токена: 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz[/dim]"
prompt = "Вставь токен бота:"
error = "[red]Неверный формат токена. Ожидается: цифры:буквы-цифры (напр. 123456:ABC-xyz)[/red]"

[telegram.user_id]
title = "[bold]Telegram User ID[/bold]"
body = "[bold]Как узнать свой Telegram User ID:[/bold]\n\n  1. Открой Telegram и найди [bold cyan]@userinfobot[/bold cyan]\n  2. Отправь [bold]/start[/bold] боту\n  3. Он ответит твоим числовым User ID\n\n[dim]Бот будет принимать сообщения только от этого User ID.[/dim]"
prompt = "Введи свой числовой User ID:"
error_nan = "[red]Введи корректное число.[/red]"
error_negative = "[red]User ID должен быть положительным числом.[/red]"

[docker]
title = "[bold]Docker-песочница[/bold]"
found_body = "[bold green]Docker обнаружен в твоей системе.[/bold green]\n\nЗапуск ductor в Docker изолирует его от хоста.\nЭто рекомендуемая конфигурация для безопасности."
found_prompt = "Включить Docker-песочницу? (Рекомендуется)"
not_found_body = "[bold yellow]Docker не найден в твоей системе.[/bold yellow]\n\nРекомендуем установить Docker для запуска бота в изолированном контейнере.\nDocker-песочницу можно включить позже в конфиге.\n\n[dim]https://docs.docker.com/get-docker/[/dim]"

[docker.extras]
title = "[bold]Доступные Docker-extras[/bold]"
col_package = "Пакет"
col_description = "Описание"
col_size = "Размер"
prompt = "Выбери extras (Пробел — переключить, Enter — подтвердить):"
hint = "[dim]Эти пакеты опциональны и увеличивают время сборки образа.\nМожно изменить позже через [cyan]ductor docker extras-add / extras-remove[/cyan].[/dim]"
auto_deps = "[dim]Автоматически добавленные зависимости: {names}[/dim]"

[timezone]
title = "[bold]Часовой пояс[/bold]"
body = "Часовой пояс используется для cron-планирования, тихих часов heartbeat\nи ежедневного сброса сессий."
prompt = "Выбери часовой пояс:"
manual_prompt = "Введи часовой пояс IANA (напр. Europe/Moscow):"
error = "[red]Неизвестный часовой пояс: {tz}[/red]"

[service]
title = "[bold]Фоновая служба[/bold]"
body = "[bold]Запустить ductor как фоновую службу?[/bold]\n\nЭто создаст {mechanism}, который:\n\n  - Запускает ductor при {trigger}\n  - Автоматически перезапускает при сбое\n  - Работает в фоновом режиме\n\n[dim]Рекомендуется для VPS или постоянно работающих систем.[/dim]"
prompt = "Установить как фоновую службу? (Рекомендуется для VPS)"

[complete]
title = "[bold green]Готово[/bold green]"
header = "[bold green]Настройка завершена![/bold green]"
files_header = "[bold]Твои файлы ductor:[/bold]"
home = "  Home:       [cyan]{path}[/cyan]"
config = "  Config:     [cyan]{path}[/cyan]"
workspace = "  Workspace:  [cyan]{path}[/cyan]"
logs = "  Logs:       [cyan]{path}[/cyan]"
installing_service = "Установка службы..."
starting_bot = "Запуск бота..."

[reset]
title = "[bold yellow]Обнаружена существующая настройка[/bold yellow]"
body = "[bold yellow]У тебя уже есть настроенная конфигурация.[/bold yellow]\n\nПовторный запуск onboarding выполнит [bold red]полный сброс[/bold red]:\n\n  [dim]{home}[/dim] будет полностью удалён.\n  Все сессии, конфиги, память и cron-задачи будут потеряны."

[reset.docker]
title = "[bold]Очистка Docker[/bold]"
body = "[bold]Docker-песочница включена в текущем конфиге.[/bold]\n\n  Контейнер: [cyan]{container}[/cyan]\n  Образ:     [cyan]{image}[/cyan]"
prompt = "Удалить Docker-контейнер и образ?"
removing = "[dim]Удаление Docker-ресурсов...[/dim]"
done = "[green]Очистка Docker завершена.[/green]"

[reset.confirm]
prompt = "Удалить всё и начать заново?"
deleted = "[dim]Рабочее пространство удалено.[/dim]"
warning = "[yellow]Внимание: не удалось полностью удалить {home}. Удали вручную.[/yellow]"

[language]
prompt = "Select language / Sprache wählen:"
